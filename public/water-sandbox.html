<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydrilla Water Preview</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://unpkg.com blob:; connect-src blob: data:; img-src data: blob:; style-src 'unsafe-inline'; worker-src blob:;"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #c {
        width: 100%;
        height: 100%;
        display: block;
      }
      #err {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #991b1b;
        background: #fef2f2;
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="err"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
        }
      }
    </script>
    <!-- Generated factories are TypeScript. Transpile inside the opaque-origin
         sandbox before importing the resulting JavaScript blob. -->
    <script src="https://unpkg.com/typescript@5.9.3/lib/typescript.js"></script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      import { OBJExporter } from "three/addons/exporters/OBJExporter.js";
      import { STLExporter } from "three/addons/exporters/STLExporter.js";

      const canvas = document.getElementById("c");
      const errEl = document.getElementById("err");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);
      const perspCam = new THREE.PerspectiveCamera(45, 1, 0.01, 200);
      perspCam.position.set(2.4, 1.6, 2.8);
      const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 200);
      orthoCam.position.copy(perspCam.position);
      let camera = perspCam;

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.target.set(0, 0.4, 0);
      let interactive = true;

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let loadToken = 0;

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      // Intensities arrive from the parent (lib/viewer/look.ts → water-look).
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const hemi = new THREE.HemisphereLight(0xffffff, 0xf4f4f5, 0.55);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, 1.2);
      key.position.set(4, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0005;
      scene.add(key);
      scene.add(key.target);
      const fill = new THREE.DirectionalLight(0xffffff, 0.35);
      fill.position.set(-4, 5, -4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, 0.25);
      rim.position.set(0, 3, -8);
      scene.add(rim);

      const grid = new THREE.GridHelper(8, 16, 0xd4d4d4, 0xe5e5e5);
      grid.visible = false;
      scene.add(grid);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.ShadowMaterial({ opacity: 0.16 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Selected-part highlight (spec from lib/viewer/highlight.ts via water-highlight).
      // Kept outside `root` so exports never include it.
      const highlightGroup = new THREE.Group();
      scene.add(highlightGroup);
      let highlightMats = null;
      let highlightName = null;

      function ensureHighlightMaterials(spec) {
        if (highlightMats || !spec) return highlightMats;
        highlightMats = {
          rim: new THREE.ShaderMaterial({
            uniforms: {
              uColor: { value: new THREE.Color(spec.color) },
              uRim: { value: spec.rimStrength },
              uFill: { value: spec.fill },
              uTime: { value: 0 },
              uPeriod: { value: spec.pulsePeriod },
            },
            vertexShader: spec.vertexShader,
            fragmentShader: spec.fragmentShader,
            transparent: true,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1,
            toneMapped: false,
          }),
          edge: new THREE.LineBasicMaterial({
            color: spec.color,
            transparent: true,
            opacity: spec.edgeOpacity,
            depthWrite: false,
            toneMapped: false,
          }),
          edgeThreshold: spec.edgeThreshold,
        };
        return highlightMats;
      }

      function followMesh(overlay, mesh) {
        overlay.matrixAutoUpdate = false;
        overlay.matrix.copy(mesh.matrixWorld);
        overlay.userData.follow = mesh;
        overlay.renderOrder = 2;
        overlay.raycast = () => {};
        return overlay;
      }

      function applyHighlight() {
        for (const child of highlightGroup.children) {
          if (child.isLineSegments) child.geometry.dispose();
        }
        highlightGroup.clear();
        if (!root || !highlightName || !highlightMats) return;
        root.updateMatrixWorld(true);
        root.traverse((child) => {
          if (!child.isMesh || child.isSkinnedMesh || child.name !== highlightName) return;
          highlightGroup.add(followMesh(new THREE.Mesh(child.geometry, highlightMats.rim), child));
          highlightGroup.add(
            followMesh(
              new THREE.LineSegments(
                new THREE.EdgesGeometry(child.geometry, highlightMats.edgeThreshold),
                highlightMats.edge
              ),
              child
            )
          );
        });
      }

      let root = null;
      /** Largest model dimension / 2 — scales the ortho frustum like ThreeViewer's normalized GLBs. */
      let modelScale = 1;
      let resolvedLook = null;
      /** name → { color, roughness, metalness }; meshes not listed use their authored material. */
      let partMaterials = {};

      function materialsOf(mesh) {
        if (!mesh || !mesh.material) return [];
        return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      }

      function readPartMaterial(mat) {
        return {
          color: mat && mat.color && mat.color.isColor ? "#" + mat.color.getHexString() : "#888888",
          roughness: typeof mat?.roughness === "number" ? mat.roughness : 0.5,
          metalness: typeof mat?.metalness === "number" ? mat.metalness : 0,
        };
      }

      /** Name unnamed meshes, give each mesh its own materials, and remember authored values. */
      function prepareMeshes(obj) {
        const authored = {};
        let unnamed = 0;
        obj.traverse((child) => {
          if (!child.isMesh) return;
          if (!child.name) child.name = `Part ${++unnamed}`;
          child.castShadow = true;
          const mats = materialsOf(child).map((m) => (m && m.clone ? m.clone() : m));
          if (mats.length) child.material = Array.isArray(child.material) ? mats : mats[0];
          for (const m of mats) if (m) m.userData.base = readPartMaterial(m);
          if (!authored[child.name] && mats[0]) authored[child.name] = readPartMaterial(mats[0]);
        });
        return authored;
      }

      function applyPartMaterials() {
        if (!root) return;
        const wire = Boolean(resolvedLook?.wireframe);
        root.traverse((child) => {
          if (!child.isMesh) return;
          const override = partMaterials[child.name];
          for (const mat of materialsOf(child)) {
            if (!mat) continue;
            const target = override || mat.userData.base;
            if (target) {
              if (mat.color && mat.color.isColor && target.color) mat.color.set(target.color);
              if ("roughness" in mat) mat.roughness = target.roughness;
              if ("metalness" in mat) mat.metalness = target.metalness;
            }
            if ("wireframe" in mat) mat.wireframe = wire;
          }
        });
      }

      function updateCamera() {
        const spec = resolvedLook?.camera || { ortho: false, fov: 45, frustum: 2.2 };
        const w = window.innerWidth;
        const h = Math.max(window.innerHeight, 1);
        const aspect = w / h;
        const next = spec.ortho ? orthoCam : perspCam;
        if (next !== camera) {
          next.position.copy(camera.position);
          next.quaternion.copy(camera.quaternion);
          camera = next;
          controls.object = camera;
        }
        if (camera === orthoCam) {
          const f = spec.frustum * modelScale;
          camera.left = -f * aspect;
          camera.right = f * aspect;
          camera.top = f;
          camera.bottom = -f;
        } else {
          camera.fov = spec.fov;
          camera.aspect = aspect;
        }
        camera.updateProjectionMatrix();
      }

      function applyLook(look) {
        if (!look || typeof look !== "object") return;
        resolvedLook = look;
        renderer.toneMappingExposure = Number(look.exposure) || 1;
        scene.background = look.background ? new THREE.Color(look.background) : null;
        grid.visible = Boolean(look.grid);
        ground.visible = Boolean(look.shadow);
        key.castShadow = Boolean(look.shadow);
        controls.autoRotate = Boolean(look.autoRotate);
        const lights = look.lights || {};
        ambient.intensity = Number(lights.ambient) || 0;
        hemi.intensity = Number(lights.hemi) || 0;
        key.intensity = Number(lights.key) || 0;
        fill.intensity = Number(lights.fill) || 0;
        rim.intensity = Number(lights.rim) || 0;
        applyPartMaterials();
        updateCamera();
      }

      /** Sit the shadow catcher/grid under the model and fit the key light's shadow frustum. */
      function fitStage(box) {
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const r = Math.max(size.x, size.y, size.z, 0.5);
        ground.position.y = box.min.y - 0.001;
        grid.position.set(center.x, box.min.y, center.z);
        grid.scale.setScalar(Math.max(1, r / 4));
        key.position.copy(center).add(new THREE.Vector3(4, 8, 5).normalize().multiplyScalar(r * 3));
        key.target.position.copy(center);
        key.target.updateMatrixWorld();
        const sc = key.shadow.camera;
        sc.left = -r * 1.5;
        sc.right = r * 1.5;
        sc.top = r * 1.5;
        sc.bottom = -r * 1.5;
        sc.near = 0.01;
        sc.far = r * 8;
        sc.updateProjectionMatrix();
        modelScale = r / 2;
      }

      function disposeObject(obj) {
        if (!obj) return;
        obj.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          const mat = child.material;
          if (!mat) return;
          if (Array.isArray(mat)) mat.forEach((m) => m.dispose?.());
          else mat.dispose?.();
        });
      }

      function applyInstanceTransform(t) {
        if (!root || !t) return;
        if (Array.isArray(t.position)) root.position.fromArray(t.position);
        if (Array.isArray(t.rotation)) root.rotation.set(t.rotation[0] || 0, t.rotation[1] || 0, t.rotation[2] || 0);
        if (Array.isArray(t.scale)) root.scale.fromArray(t.scale);
      }

      // Select on click only — orbit drags must not change the selected part.
      let pointerDownAt = null;
      canvas.addEventListener("pointerdown", (ev) => {
        pointerDownAt = [ev.clientX, ev.clientY];
      });
      canvas.addEventListener("pointerup", (ev) => {
        if (!pointerDownAt) return;
        const moved = Math.hypot(ev.clientX - pointerDownAt[0], ev.clientY - pointerDownAt[1]);
        pointerDownAt = null;
        if (moved > 4 || !root) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObject(root, true).find((h) => h.object.isMesh);
        parent.postMessage({ type: "water-select", name: hit?.object.name || null }, "*");
      });

      function showError(msg) {
        errEl.style.display = "flex";
        errEl.textContent = msg;
        parent.postMessage({ type: "code-sculpt-error", message: msg }, "*");
      }

      function clearError() {
        errEl.style.display = "none";
      }

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        updateCamera();
      }
      window.addEventListener("resize", resize);
      resize();

      function frame(time) {
        // Factories are static (D2). Never run userData.tick even if older jobs still emit it.
        if (interactive) controls.update();
        if (highlightMats) highlightMats.rim.uniforms.uTime.value = (time || 0) / 1000;
        for (const overlay of highlightGroup.children) {
          overlay.matrix.copy(overlay.userData.follow.matrixWorld);
        }
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      frame();

      function captureThumbnail() {
        return new Promise((resolve) => {
          try {
            interactive = false;
            controls.enableDamping = false;
            controls.update();
            highlightGroup.visible = false;
            renderer.render(scene, camera);
            const raw = canvas.toDataURL("image/jpeg", 0.85);
            highlightGroup.visible = true;
            const img = new Image();
            img.onload = () => {
              try {
                const max = 512;
                const scale = Math.min(1, max / Math.max(img.width, img.height));
                const w = Math.max(1, Math.round(img.width * scale));
                const h = Math.max(1, Math.round(img.height * scale));
                const off = document.createElement("canvas");
                off.width = w;
                off.height = h;
                const ctx = off.getContext("2d");
                if (!ctx) {
                  resolve(raw);
                } else {
                  ctx.fillStyle = "#ffffff";
                  ctx.fillRect(0, 0, w, h);
                  ctx.drawImage(img, 0, 0, w, h);
                  resolve(off.toDataURL("image/jpeg", 0.82));
                }
              } catch {
                resolve(raw);
              } finally {
                controls.enableDamping = true;
                interactive = true;
              }
            };
            img.onerror = () => {
              controls.enableDamping = true;
              interactive = true;
              resolve(raw);
            };
            img.src = raw;
          } catch {
            controls.enableDamping = true;
            interactive = true;
            resolve(null);
          }
        });
      }

      async function loadFactory(code) {
        const token = ++loadToken;
        clearError();
        glbCache = null;
        glbWarmToken += 1;
        if (root) {
          scene.remove(root);
          disposeObject(root);
          root = null;
        }
        applyHighlight();
        try {
          if (!window.ts?.transpileModule) {
            throw new Error("TypeScript preview compiler did not load");
          }

          // Existing / LLM factories often use bare MeshStandardMaterial even when they
          // `import * as THREE from "three"`. ES modules have no THREE globals, so inject
          // local aliases (and strip duplicate three imports) before compile+import.
          const prepared = prepareFactorySource(code);

          const compiled = window.ts.transpileModule(prepared, {
            compilerOptions: {
              target: window.ts.ScriptTarget.ES2022,
              module: window.ts.ModuleKind.ES2022,
              isolatedModules: true,
            },
            reportDiagnostics: true,
          });
          const fatal = (compiled.diagnostics || []).filter(
            (d) => d.category === window.ts.DiagnosticCategory.Error
          );
          // Don't hard-fail on type diagnostics — runtime is what matters for preview.
          // Only block if transpile produced empty output.
          if (!compiled.outputText || !String(compiled.outputText).trim()) {
            const first = fatal[0];
            throw new Error(
              "Generated TypeScript is invalid: " +
                (first
                  ? window.ts.flattenDiagnosticMessageText(first.messageText, "\n")
                  : "empty compile output")
            );
          }
          const blob = new Blob([compiled.outputText], { type: "text/javascript" });
          const url = URL.createObjectURL(blob);
          let mod;
          try {
            mod = await import(/* @vite-ignore */ url);
          }           finally {
            URL.revokeObjectURL(url);
          }
          if (token !== loadToken) return;
          const factory =
            mod.createModel ||
            mod.default ||
            mod.createObjectModel ||
            Object.values(mod).find((v) => typeof v === "function");
          if (typeof factory !== "function") {
            throw new Error("No createModel() export found in generated code");
          }
          const next = factory();
          if (!next || !next.isObject3D) {
            throw new Error("createModel() did not return a THREE.Object3D");
          }
          if (token !== loadToken) {
            disposeObject(next);
            return;
          }
          if (root) {
            scene.remove(root);
            disposeObject(root);
            root = null;
          }
          const authored = prepareMeshes(next);
          root = next;
          glbCache = null;
          glbWarmToken += 1;
          scene.add(root);
          applyInstanceTransform(window.__waterInstance || null);
          applyPartMaterials();
          applyHighlight();
          const box = new THREE.Box3().setFromObject(root);
          const size = box.getSize(new THREE.Vector3()).length() || 1;
          const center = box.getCenter(new THREE.Vector3());
          fitStage(box);
          updateCamera();
          // Deterministic three-quarter framing (img2threejs capture rules)
          controls.target.copy(center);
          camera.position.copy(center).add(new THREE.Vector3(size * 0.7, size * 0.45, size * 0.85));
          controls.update();
          renderer.render(scene, camera);

          function computeModelStats(obj) {
            let vertices = 0;
            let faces = 0;
            let meshCount = 0;
            let boundaryEdges = 0;
            let nonManifoldEdges = 0;
            let totalEdgesChecked = 0;

            obj.traverse((child) => {
              if (!child.isMesh || !child.geometry) return;
              meshCount++;
              const pos = child.geometry.attributes?.position;
              if (!pos) return;
              vertices += pos.count;
              const index = child.geometry.index;
              const triCount = index ? Math.floor(index.count / 3) : Math.floor(pos.count / 3);
              faces += triCount;

              if (triCount > 0 && triCount <= 100000) {
                const edgeMap = new Map();
                const getIdx = (vOffset) => {
                  if (index) return String(index.getX(vOffset));
                  const x = Math.round(pos.getX(vOffset) * 1000);
                  const y = Math.round(pos.getY(vOffset) * 1000);
                  const z = Math.round(pos.getZ(vOffset) * 1000);
                  return `${x},${y},${z}`;
                };
                for (let t = 0; t < triCount; t++) {
                  const i0 = getIdx(t * 3);
                  const i1 = getIdx(t * 3 + 1);
                  const i2 = getIdx(t * 3 + 2);
                  const addEdge = (a, b) => {
                    const key = a < b ? `${a}_${b}` : `${b}_${a}`;
                    edgeMap.set(key, (edgeMap.get(key) || 0) + 1);
                  };
                  addEdge(i0, i1);
                  addEdge(i1, i2);
                  addEdge(i2, i0);
                }
                edgeMap.forEach((count) => {
                  totalEdgesChecked++;
                  if (count === 1) boundaryEdges++;
                  else if (count > 2) nonManifoldEdges++;
                });
              }
            });

            const isWatertight = faces > 0 && totalEdgesChecked > 0 && boundaryEdges === 0 && nonManifoldEdges === 0;
            return {
              vertices,
              faces,
              topology: isWatertight ? "Watertight Triangles" : "Triangles",
              isWatertight,
              meshCount,
            };
          }

          const modelStats = computeModelStats(root);

          parent.postMessage({
            type: "code-sculpt-ready",
            meshNames: Object.keys(authored),
            parts: authored,
            stats: modelStats,
          }, "*");

          // One stable frame later → thumbnail for library cards
          requestAnimationFrame(async () => {
            const dataUrl = await captureThumbnail();
            if (dataUrl) {
              parent.postMessage(
                { type: "code-sculpt-thumbnail", dataUrl, cameraView: "three-quarter" },
                "*"
              );
            }
            // Warm GLB in idle time so Download GLB is near-instant.
            scheduleGlbWarm();
          });
        } catch (e) {
          if (token !== loadToken) return;
          glbCache = null;
          showError(e?.message || String(e));
        }
      }

      /**
       * Make LLM factories resilient in an ES-module sandbox:
       * - ensure `import * as THREE from "three"`
       * - bind common constructors as locals (MeshStandardMaterial, Mesh, Group, …)
       * so bare `new MeshStandardMaterial()` works on refresh/reopen.
       */
      function prepareFactorySource(raw) {
        let body = String(raw || "");
        // Drop existing three imports — we inject a single canonical one.
        body = body.replace(
          /^\s*import\s+\*\s+as\s+THREE\s+from\s+['"]three['"]\s*;?\s*/gm,
          ""
        );
        body = body.replace(
          /^\s*import\s+\{[^}]*\}\s+from\s+['"]three['"]\s*;?\s*/gm,
          ""
        );
        body = body.replace(
          /^\s*import\s+THREE\s+from\s+['"]three['"]\s*;?\s*/gm,
          ""
        );

        const preamble = `import * as THREE from "three";
const {
  MeshStandardMaterial, MeshPhysicalMaterial, MeshBasicMaterial, MeshLambertMaterial,
  MeshPhongMaterial, MeshToonMaterial, MeshNormalMaterial, MeshDepthMaterial,
  MeshMatcapMaterial, LineBasicMaterial, LineDashedMaterial, PointsMaterial,
  ShaderMaterial, RawShaderMaterial, ShadowMaterial, SpriteMaterial,
  BoxGeometry, SphereGeometry, CylinderGeometry, ConeGeometry, TorusGeometry,
  PlaneGeometry, CircleGeometry, RingGeometry, TorusKnotGeometry, CapsuleGeometry,
  LatheGeometry, ExtrudeGeometry, ShapeGeometry, TubeGeometry, BufferGeometry,
  Mesh, Group, Object3D, Color, Vector2, Vector3, Vector4, Euler, Quaternion,
  Matrix3, Matrix4, Box3, Sphere, Ray, Triangle, MathUtils,
  BufferAttribute, Float32BufferAttribute, Uint16BufferAttribute, Uint32BufferAttribute,
  CanvasTexture, DataTexture, Texture, Shape, Path, CurvePath,
  CatmullRomCurve3, QuadraticBezierCurve3, CubicBezierCurve3,
  DoubleSide, FrontSide, BackSide, RepeatWrapping, ClampToEdgeWrapping, MirroredRepeatWrapping,
  SRGBColorSpace, LinearSRGBColorSpace, NoColorSpace,
  AdditiveBlending, NormalBlending, MultiplyBlending, SubtractiveBlending,
  LoopOnce, LoopRepeat, LoopPingPong
} = THREE;
`;
        return preamble + "\n" + body;
      }

      const gltfExporter = new GLTFExporter();
      const objExporter = new OBJExporter();
      const stlExporter = new STLExporter();

      /** Cached GLB so the common download path is instant after first build / idle warm. */
      let glbCache = null; // ArrayBuffer | null
      let glbWarmToken = 0;

      function arrayBufferToBase64(ab) {
        const bytes = new Uint8Array(ab);
        const chunk = 0x8000;
        let binary = "";
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      }

      function replyExport(requestId, format, payload, transfer = []) {
        parent.postMessage(
          { type: "code-sculpt-export-result", requestId, format, ...payload },
          "*",
          transfer
        );
      }

      /** Reply with transferable buffer + base64 fallback (cross-iframe instanceof can fail). */
      function replyBinary(requestId, format, filename, mime, ab) {
        const transferCopy = ab.slice(0);
        const base64 = arrayBufferToBase64(ab);
        replyExport(
          requestId,
          format,
          {
            ok: true,
            filename,
            mime,
            buffer: transferCopy,
            base64,
          },
          [transferCopy]
        );
      }

      function objectForExport() {
        if (!root) throw new Error("Nothing to export yet — wait for the preview to finish loading.");
        root.updateMatrixWorld(true);
        return root;
      }

      async function buildGlbBuffer() {
        const object = objectForExport();
        const result = await gltfExporter.parseAsync(object, {
          binary: true,
          onlyVisible: true,
          truncateDrawRange: true,
          embedImages: true,
        });
        const ab = result instanceof ArrayBuffer ? result : result.buffer;
        // Copy so we can keep a cache AND transfer a slice to the parent.
        const copy = ab.slice(0);
        glbCache = ab.slice(0);
        return copy;
      }

      function scheduleGlbWarm() {
        const token = ++glbWarmToken;
        const run = () => {
          if (token !== glbWarmToken || !root) return;
          void buildGlbBuffer().catch(() => {});
        };
        if (typeof requestIdleCallback === "function") {
          requestIdleCallback(run, { timeout: 1200 });
        } else {
          setTimeout(run, 280);
        }
      }

      async function exportModel(format, requestId) {
        try {
          const baseName = "hydrilla-water-model";

          if (format === "glb") {
            let ab = glbCache ? glbCache.slice(0) : null;
            if (!ab) ab = await buildGlbBuffer();
            replyBinary(requestId, format, `${baseName}.glb`, "model/gltf-binary", ab);
            return;
          }

          if (format === "gltf") {
            const object = objectForExport();
            // JSON glTF with embedded buffers/images — single self-contained .gltf file.
            const result = await gltfExporter.parseAsync(object, {
              binary: false,
              onlyVisible: true,
              truncateDrawRange: true,
              embedImages: true,
            });
            const text = typeof result === "string" ? result : JSON.stringify(result, null, 2);
            replyExport(requestId, format, {
              ok: true,
              filename: `${baseName}.gltf`,
              mime: "model/gltf+json",
              text,
            });
            return;
          }

          if (format === "obj") {
            const text = objExporter.parse(objectForExport());
            replyExport(requestId, format, {
              ok: true,
              filename: `${baseName}.obj`,
              mime: "text/plain",
              text,
            });
            return;
          }

          if (format === "stl") {
            const result = stlExporter.parse(objectForExport(), { binary: true });
            const ab =
              result instanceof ArrayBuffer
                ? result
                : new TextEncoder().encode(String(result)).buffer.slice(0);
            replyBinary(requestId, format, `${baseName}.stl`, "model/stl", ab);
            return;
          }

          if (format === "png") {
            interactive = false;
            controls.enableDamping = false;
            controls.update();
            highlightGroup.visible = false;
            renderer.render(scene, camera);
            const blob = await new Promise((resolve, reject) => {
              canvas.toBlob(
                (b) => (b ? resolve(b) : reject(new Error("PNG capture failed"))),
                "image/png"
              );
            });
            highlightGroup.visible = true;
            controls.enableDamping = true;
            interactive = true;
            const ab = await blob.arrayBuffer();
            replyBinary(requestId, format, `${baseName}.png`, "image/png", ab);
            return;
          }

          replyExport(requestId, format, {
            ok: false,
            error: `Unsupported export format: ${format}`,
          });
        } catch (e) {
          replyExport(requestId, format, {
            ok: false,
            error: e?.message || String(e),
          });
        }
      }

      window.addEventListener("message", (ev) => {
        const data = ev.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "code-sculpt-load" && typeof data.code === "string") {
          if (data.instance) window.__waterInstance = data.instance;
          partMaterials = {};
          loadFactory(data.code);
        }
        if (data.type === "water-transform" && data.instance) {
          window.__waterInstance = data.instance;
          applyInstanceTransform(data.instance);
        }
        if (data.type === "water-parts") {
          partMaterials = data.parts && typeof data.parts === "object" ? data.parts : {};
          applyPartMaterials();
        }
        if (data.type === "water-look" && data.look) {
          applyLook(data.look);
        }
        if (data.type === "water-highlight") {
          ensureHighlightMaterials(data.spec);
          highlightName = typeof data.name === "string" ? data.name : null;
          applyHighlight();
        }
        if (data.type === "code-sculpt-export" && data.format && data.requestId) {
          void exportModel(String(data.format), data.requestId);
        }
      });

      parent.postMessage({ type: "code-sculpt-boot" }, "*");
    </script>
  </body>
</html>
